# ViViD Edit を NAS から配るための nginx 設定。
# UGREEN NAS（UGOS Pro）の Docker で、nginx:alpine にこれを食わせる前提。
# 本物の nginx 1.24 で、一覧・Range・キャッシュ指示まで確認済み。
#
# 肝は「アプリと素材を同じ口から出す」こと。
# 別のポートや別のホストに分けると、ブラウザから見て別オリジンになり、
# 素材の読み込みが CORS で止まる。1 つにまとめておけば設定が要らない。

server {
    listen 80;
    server_name _;

    # アップロードはしないので、大きさの制限は要らない。
    client_max_body_size 0;

    root /srv/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 皆で使う素材。読み取り専用でマウントする（compose の :ro）。
    location /media/ {
        alias /srv/media/;

        # アプリが中身を一覧するのに使う。
        # JSON で返すのは、HTML を読んで <a> を拾うより確実なため
        # （アプリ側は HTML も読めるが、こちらの方が崩れない）。
        autoindex on;
        autoindex_format json;

        # 動画の途中から再生するのに要る。既定で有効だが、明示しておく。
        add_header Accept-Ranges bytes;

        # 素材は差し替えることがあるので、握ったまま離さないようにはしない。
        add_header Cache-Control "public, max-age=60";
    }

    # 個人素材。この下に人ごとのフォルダが並ぶ（media-personal/sato/ など）。
    #
    # 注意: これは仕分けであって、アクセス制限ではない。
    # このアプリには誰が見ているかを知る手段が無いので、フォルダ名さえ分かれば
    # 誰の個人フォルダでも開ける。人に見られて困るものは置かないこと。
    location /media-personal/ {
        alias /srv/media-personal/;

        autoindex on;
        autoindex_format json;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=60";
    }

    # 軽量版（プレビュー用の小さな複製）。proxy.sh が作って、ここから配る。
    # 置き場所の規則: /media/a/b.mp4 の軽量版は /proxy/media/a/b.mp4.proxy.mp4。
    # 無いときは 404 になり、アプリは元の動画をそのまま使う（無くても困らない）。
    location /proxy/ {
        alias /srv/proxy/;
        add_header Accept-Ranges bytes;
        # 作り直されることがあるので、握ったまま離さないようにはしない。
        add_header Cache-Control "public, max-age=60";
    }

    # アプリ本体は入れ替えるので、index.html は毎回確かめさせる。
    # ファイル名にハッシュが付く assets/ の方は、長く持たせて構わない。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 文字起こしの一式（transformers.js・onnxruntime の wasm・モデル）。
    # 数十 MB〜1GB になるので、一度取ったら取り直させない。
    location /whisper/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/wasm wasm;
            text/javascript  js mjs;
            application/json json;
        }
    }

    # CPU で回すとき、下の 2 行を入れると onnxruntime が複数の糸を使えるようになり、
    # 文字起こしがかなり速くなる（SharedArrayBuffer が要るため）。
    # ただし**この画面に他所から読み込んでいるものが全部止まる**ので、
    # 外の URL の素材を使っているなら入れないこと。GPU で回すなら要らない。
    #
    #   add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    #   add_header Cross-Origin-Embedder-Policy "require-corp" always;
}
